name: diag
on:
  push:
    branches: [diag]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - shell: bash {0}
        env:
          ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          python -m pipeline.build --out out > all.log 2>&1; echo "exit $?" > tb.txt
          echo "league_id_set=$([ -n "$ESPN_LEAGUE_ID" ] && echo yes) s2_len=${#ESPN_S2} swid_len=${#ESPN_SWID} pw_set=$([ -n "$SITE_PASSWORD" ] && echo yes)" >> tb.txt
          grep -E "ERROR|espn league|Traceback|File \"/home/runner|Error:|Exception|done in|wrote" all.log | grep -viE "s2=|swid=" | sed -E 's/\{[0-9A-Fa-f-]{30,}\}/{SWID}/g' | tail -40 >> tb.txt
          sed -n '/Traceback/,$p' all.log | sed -E 's/\{[0-9A-Fa-f-]{30,}\}/{SWID}/g' | tail -30 >> tb.txt
          git config user.name diag-bot && git config user.email diag@users.noreply.github.com
          git checkout -q --orphan diag-out && git rm -rqf --cached . && git add -f tb.txt && git commit -qm tb && git push -qf origin diag-out
