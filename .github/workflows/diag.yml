name: diag
on:
  push:
    branches: [diag]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36"
          probe() { echo "== $1"; curl -sS -A "$UA" -o body -w "%{http_code}\n" "$1" ${2:+-H "$2"}; head -c 300 body; echo; }
          {
          probe "https://lm-api-reads.fantasy.espn.com/apps/fantasy/ffl/seasons/2026/segments/0/leagues/1?view=mSettings"
          probe "https://lm-api-reads.fantasy.espn.com/apps/fantasy/ffl/seasons/2026/segments/0/leagues/12345678?view=mSettings"
          probe "https://lm-api-reads.fantasy.espn.com/apps/fantasy/ffl/seasons/2026/segments/0/leaguedefaults/3?view=kona_player_info"
          probe "https://lm-api-reads.fantasy.espn.com/apps/fantasy/ffl/seasons/2026/players?scoringPeriodId=0&view=players_wl" 'x-fantasy-filter: {"filterActive":{"value":true}}'
          probe "https://fantasy.espn.com/apps/fantasy/ffl/seasons/2026/segments/0/leaguedefaults/3?view=kona_player_info"
          probe "https://lm-api-reads.fantasy.espn.com/apps/fantasy/ffl/seasons/2026/segments/0/leaguedefaults/1?view=kona_player_info" 'x-fantasy-filter: {"players":{"limit":5,"sortPercOwned":{"sortPriority":1,"sortAsc":false}}}'
          } > probe.txt 2>&1
          git init -q . && git config user.name diag-bot && git config user.email diag@users.noreply.github.com
          git checkout -q --orphan diag-out && git add probe.txt && git commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-out
