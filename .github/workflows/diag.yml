name: diag
on:
  push:
    branches: [diag]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - shell: bash {0}
        env:
          ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          python -m pipeline.build --out out > all.log 2>&1; echo "exit $?" > tb.txt
          grep -E "ERROR|espn league|player news|Traceback|Error|done in|source failed" all.log | sed -E 's/\{[0-9A-Fa-f-]{30,}\}/{SWID}/g' | cut -c1-220 | tail -25 >> tb.txt
          python3 - >> tb.txt 2>&1 <<'PY'
          import json, os
          from pipeline import crypto
          d = json.loads(crypto.decrypt(open("out/data.enc.json").read(), os.environ["SITE_PASSWORD"]))
          P = d["players"]
          notes = [n for r in P.values() for n in r.get("notes", [])]
          keys = ["is O", "is IR", "is D", "Pass protection", "Run-blocking", "blitzes", "Play-action", "stacks the box", "Handcuff", "Coach talk"]
          print({k: sum(1 for n in notes if k in n) for k in keys})
          print("players with coach quotes:", sum(1 for r in P.values() if (r.get("news") or {}).get("quotes")))
          print("tendency traits per team:", [len((p.get("tendency") or {}).get("traits", [])) for p in d.get("profiles", {}).values()])
          print("season:", {k: d.get("season", {}).get(k) for k in ("odds", "proj_wins", "proj_losses", "wins_needed", "mode")})
          print("waivers:", len(d["waivers"]["adds"]), "stashes:", len(d["waivers"].get("stashes", [])), "rank:", d["waivers"].get("waiver_rank"))
          print("trades:", len(d.get("trades", [])), "sources:", d["meta"]["sources"])
          PY
          git config user.name diag-bot && git config user.email diag@users.noreply.github.com
          git checkout -q --orphan diag-out && git rm -rqf --cached . && git add -f tb.txt && git commit -qm tb && git push -qf origin diag-out
