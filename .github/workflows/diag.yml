name: diag
on:
  push:
    branches: [diag]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36"
          probe() { echo "== $1"; curl -sS -A "$UA" -o body -w "%{http_code}\n" "$1" ${2:+-H "$2"}; head -c 300 body; echo; }
          {
          H1="Accept: application/json"; H2="Referer: https://fantasy.espn.com/"; H3="Origin: https://fantasy.espn.com"; H4="x-fantasy-source: kona"; H5="x-fantasy-platform: kona-PROD-m.fc.latest.kona-hyper"
          U="https://lm-api-reads.fantasy.espn.com/apps/fantasy/ffl/seasons/2026/segments/0/leagues/12345678?view=mSettings"
          echo "== headers"; curl -sS -A "$UA" -H "$H1" -H "$H2" -H "$H3" -H "$H4" -H "$H5" -o body -w "%{http_code}\n" "$U"; head -c 200 body; echo
          echo "== headers http1.1"; curl -sS --http1.1 -A "$UA" -H "$H1" -H "$H2" -H "$H3" -H "$H4" -H "$H5" -o body -w "%{http_code}\n" "$U"; head -c 200 body; echo
          echo "== no UA"; curl -sS -o body -w "%{http_code}\n" "$U"; head -c 120 body; echo
          echo "== fantasy.espn.com follow"; curl -sSL -A "$UA" -H "$H1" -o body -w "%{http_code} %{url_effective}\n" "https://fantasy.espn.com/apps/fantasy/ffl/seasons/2026/segments/0/leagues/12345678?view=mSettings"; head -c 200 body; echo
          echo "== 2025 season"; curl -sS -A "$UA" -H "$H1" -o body -w "%{http_code}\n" "https://lm-api-reads.fantasy.espn.com/apps/fantasy/ffl/seasons/2025/segments/0/leagues/12345678?view=mSettings"; head -c 120 body; echo
          echo "== CORS preflight"; curl -sS -X OPTIONS -A "$UA" -H "Origin: https://josh122208.github.io" -H "Access-Control-Request-Method: GET" -D - -o /dev/null "$U" | grep -i -E "^HTTP|access-control" ; echo
          echo "== ip"; curl -sS https://api.ipify.org; echo
          } > probe.txt 2>&1
          git init -q . && git config user.name diag-bot && git config user.email diag@users.noreply.github.com
          git checkout -q --orphan diag-out && git add probe.txt && git commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-out
